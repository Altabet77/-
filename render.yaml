services:
  - type: web
    name: samir-ai-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DEFAULT_AI_PROVIDER
        value: duckai
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false



